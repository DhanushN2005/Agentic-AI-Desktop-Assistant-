<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #030812;
      color: #e0f0ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .pulse {
      width: 8px;
      height: 8px;
      background: #00f2ff;
      border-radius: 50%;
      box-shadow: 0 0 8px #00f2ff;
    }
    .title {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1.5px;
      color: #00f2ff;
    }
    .btn {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      background: rgba(0, 242, 255, 0.1);
      border: 1px solid rgba(0, 242, 255, 0.35);
      border-radius: 6px;
      color: #00f2ff;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(0, 242, 255, 0.25);
      border-color: #00f2ff;
      box-shadow: 0 0 10px rgba(0, 242, 255, 0.4);
    }
    .status {
      font-size: 11px;
      color: #7b93a8;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="pulse"></div>
    <div class="title">FLEXIE</div>
  </div>
  <button class="btn" id="btnOpenSidebar">⚡ Open Flexie Sidebar</button>
  <button class="btn" id="btnOpenDashboard">🌐 Open Web Dashboard</button>
  <div class="status">Connected to Flexie 2.0 (Port 8768)</div>

  <script>
    document.getElementById("btnOpenSidebar").addEventListener("click", async () => {
      const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
      if (tab && chrome.sidePanel && chrome.sidePanel.open) {
        chrome.sidePanel.open({ tabId: tab.id });
        window.close();
      }
    });

    document.getElementById("btnOpenDashboard").addEventListener("click", () => {
      chrome.tabs.create({ url: "http://localhost:8766/" });
      window.close();
    });
  </script>
</body>
</html>
