<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flexie</title>
  <style>
    :root {
      --accent: #00f2ff;
      --accent-glow: rgba(0,242,255,0.25);
      --bg: #030812;
      --card: rgba(10,20,36,0.9);
      --border: rgba(0,242,255,0.15);
      --muted: #7b93a8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 290px;
      background: var(--bg);
      color: #e0f0ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .pulse {
      width: 8px; height: 8px;
      background: var(--accent); border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: .7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .title { font-size: 13px; font-weight: bold; letter-spacing: 1.5px; color: var(--accent); }
    .version { font-size: 9px; color: var(--muted); letter-spacing: .8px; }

    /* Status card */
    .status-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .status-label { font-size: 10px; letter-spacing: 1px; color: var(--muted); }
    .status-indicator {
      display: flex; align-items: center; gap: 6px;
      font-size: 10px; font-weight: 700; letter-spacing: .8px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      transition: background .3s, box-shadow .3s;
    }
    .dot.online  { background: #00ffaa; box-shadow: 0 0 8px rgba(0,255,170,.5); }
    .dot.offline { background: #ff3b30; box-shadow: 0 0 8px rgba(255,59,48,.4); }
    .status-text { transition: color .3s; }
    .status-text.online  { color: #00ffaa; }
    .status-text.offline { color: #ff3b30; }

    .token-row {
      font-size: 9.5px; color: var(--muted);
      display: flex; align-items: center; gap: 5px;
    }
    .token-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
    .token-dot.ok { background: #00ffaa; }

    /* Buttons */
    .btn {
      width: 100%; padding: 10px 12px;
      margin-top: 8px;
      background: rgba(0,242,255,.07);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--accent);
      font-weight: 700; font-size: 12px;
      cursor: pointer; text-align: left;
      display: flex; align-items: center; gap: 9px;
      transition: all .18s;
    }
    .btn:hover {
      background: rgba(0,242,255,.18);
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .btn .icon { font-size: 14px; }
    .btn.secondary { color: #a0c4d8; border-color: rgba(0,242,255,.1); }
    .btn.secondary:hover { color: #e0f0ff; }

    /* DOM quick chips */
    .section-label {
      font-size: 9px; letter-spacing: 1.2px; color: var(--muted);
      margin: 14px 0 6px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      background: rgba(169,112,255,.07);
      border: 1px solid rgba(169,112,255,.2);
      border-radius: 12px; color: #c8a8ff;
      font-size: 10px; padding: 4px 10px;
      cursor: pointer; transition: all .18s;
    }
    .chip:hover {
      background: rgba(169,112,255,.2);
      border-color: #a970ff; color: #fff;
    }

    /* Footer */
    .footer {
      margin-top: 14px; padding-top: 10px;
      border-top: 1px solid rgba(0,242,255,.07);
      font-size: 9.5px; color: var(--muted); text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="pulse"></div>
      <div class="title">FLEXIE</div>
    </div>
    <div class="version">v2.0 · PORT 8768</div>
  </div>

  <!-- Live status card -->
  <div class="status-card">
    <div>
      <div class="status-label">BACKEND STATUS</div>
      <div class="status-indicator">
        <div class="dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Checking…</span>
      </div>
    </div>
    <div class="token-row">
      <div class="token-dot" id="tokenDot"></div>
      <span id="tokenText">token —</span>
    </div>
  </div>

  <!-- Primary actions -->
  <button class="btn" id="btnOpenSidebar">
    <span class="icon">⚡</span> Open Flexie Sidebar
  </button>
  <button class="btn secondary" id="btnOpenDashboard">
    <span class="icon">🌐</span> Open Web Dashboard
  </button>

  <!-- Mail quick actions -->
  <div class="section-label">MAIL</div>
  <div class="chips">
    <div class="chip" data-mail="inbox">✉ Inbox</div>
    <div class="chip" data-mail="count">🔢 Count</div>
    <div class="chip" data-mail="summarize">🤖 AI Summary</div>
    <div class="chip" data-mail="sent">📤 Sent</div>
  </div>

  <!-- DOM quick-run chips -->
  <div class="section-label">QUICK DOM TASKS</div>
  <div class="chips">
    <div class="chip" data-dom="extract tables">⊞ Tables</div>
    <div class="chip" data-dom="extract links">🔗 Links</div>
    <div class="chip" data-dom="scroll to bottom">↓ Scroll</div>
    <div class="chip" data-dom="scroll to top">↑ Top</div>
    <div class="chip" data-dom="submit form">✓ Submit</div>
  </div>

  <div class="footer" id="footer">Flexie Autonomous Agent 2.0</div>

  <script>
    const API_BASE = "http://127.0.0.1:8768";

    const statusDot  = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const tokenDot   = document.getElementById("tokenDot");
    const tokenText  = document.getElementById("tokenText");
    const footer     = document.getElementById("footer");

    async function checkHealth() {
      try {
        const res = await fetch(`${API_BASE}/health`, {
          method: "GET",
          signal: AbortSignal.timeout(2500),
        });
        if (res.ok) {
          const data = await res.json().catch(() => ({}));
          statusDot.className  = "dot online";
          statusText.className = "status-text online";
          statusText.textContent = "ONLINE";
          if (data.token) {
            chrome.storage.local.set({ flexie_token: data.token });
            tokenDot.className = "token-dot ok";
            tokenText.textContent = "token ✓";
          } else {
            // Check cached token
            const cached = await chrome.storage.local.get(["flexie_token"]);
            if (cached.flexie_token) {
              tokenDot.className = "token-dot ok";
              tokenText.textContent = "token cached";
            } else {
              tokenText.textContent = "no token";
            }
          }
          footer.textContent = `Connected · ${data.version || "2.0"}`;
        } else {
          throw new Error(res.status);
        }
      } catch (e) {
        statusDot.className  = "dot offline";
        statusText.className = "status-text offline";
        statusText.textContent = "OFFLINE";
        tokenText.textContent = "no token";
        footer.textContent = "Start api_server.py on port 8768";
      }
    }

    checkHealth();
    setInterval(checkHealth, 6000);

    // Open sidebar
    document.getElementById("btnOpenSidebar").addEventListener("click", async () => {
      const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
      if (tab && chrome.sidePanel?.open) {
        chrome.sidePanel.open({ tabId: tab.id });
        window.close();
      }
    });

    // Open dashboard
    document.getElementById("btnOpenDashboard").addEventListener("click", () => {
      chrome.tabs.create({ url: "http://localhost:8766/" });
      window.close();
    });

    // Mail chips — stash a mail action key and open sidebar
    document.querySelectorAll(".chip[data-mail]").forEach(chip => {
      chip.addEventListener("click", async () => {
        const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
        if (tab) {
          await chrome.storage.local.set({ flexie_pending_mail_cmd: chip.dataset.mail });
          if (chrome.sidePanel?.open) chrome.sidePanel.open({ tabId: tab.id });
          window.close();
        }
      });
    });

    // DOM quick chips — open sidebar with pre-typed command
    document.querySelectorAll(".chip[data-dom]").forEach(chip => {
      chip.addEventListener("click", async () => {
        const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
        if (tab) {
          // Stash command; sidebar.js picks it up on load via storage
          await chrome.storage.local.set({ flexie_pending_dom_cmd: chip.dataset.dom });
          if (chrome.sidePanel?.open) {
            chrome.sidePanel.open({ tabId: tab.id });
          }
          window.close();
        }
      });
    });
  </script>
</body>
</html>
