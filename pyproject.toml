[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flexie"
version = "2.0.0"
description = "Flexie 2.0 — Windows desktop agentic AI assistant (voice, browser, memory, MCP, jobs, REST API)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agent", "assistant", "automation", "voice", "windows"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Desktop Environment",
]
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "websockets>=12.0,<17.0.0",
    "pypdf>=4.0.0,<7.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
voice = ["pyttsx3>=2.90", "SpeechRecognition>=3.10.0", "vosk>=0.3.45", "edge-tts>=7.0.0"]
ui = ["PyQt6>=6.5.0", "pygame>=2.5.0"]
browser = ["playwright>=1.52.0,<2.0.0"]
dev = ["pytest", "pytest-timeout", "pytest-cov", "ruff"]

[project.scripts]
flexie = "main:main"

[tool.setuptools.packages.find]
include = ["adapters*", "agents*", "context*", "core*", "engines*", "evals*",
           "interface*", "recovery*", "sandbox*", "sdd*", "skills*",
           "tools*", "utils*", "verification*", "vision*", "voice*"]
exclude = ["tests*", "workspace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
branch = false
source = ["core", "engines", "interface", "utils", "verification"]

[tool.coverage.report]
# Measured baseline before the gate was introduced: 37%. The floor blocks
# regressions; raise it as suites grow.
skip_empty = true
fail_under = 36
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E731", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
# These modules must execute a statement before importing project packages:
#   main.py          — silences deprecation warnings before google imports
#   core/brain.py    — filters google FutureWarnings before the genai import
#   interface/ui.py  — bootstraps the project root onto sys.path (runs as a script)
#   interface/api_server.py — same sys.path bootstrap, before utils imports
#   tests/test_app_op_voice.py — installs module stubs before importing handlers
"main.py" = ["E402"]
"core/brain.py" = ["E402"]
"interface/ui.py" = ["E402"]
"interface/api_server.py" = ["E402"]
"tests/test_app_op_voice.py" = ["E402"]
